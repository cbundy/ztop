name: ZFS Integration Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  zfs-e2e:
    name: ZFS end-to-end (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ZFS integration tests in Docker
        run: bash scripts/run-integration-tests.sh
