name: ZFS Integration Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  zfs-e2e:
    name: ZFS end-to-end (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ZFS userland and load module
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
          zfs version
          ls /proc/spl/kstat/zfs/

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --all

      - name: Run unit tests
        run: cargo test --all

      - name: Create test ZFS pool and dataset
        run: |
          set -euo pipefail
          truncate -s 256M /tmp/ztoptest.img
          sudo zpool create -f ztoptest /tmp/ztoptest.img
          sudo zfs create ztoptest/data
          sudo chown -R "$USER" /ztoptest /ztoptest/data
          sudo zpool status ztoptest
          sudo zfs list -r ztoptest

      - name: Verify kstat objset files exist
        run: |
          set -euo pipefail
          ls -la /proc/spl/kstat/zfs/ztoptest/
          for f in /proc/spl/kstat/zfs/ztoptest/objset-*; do
            echo "=== $f ==="
            sudo cat "$f"
          done

      - name: Start ztop-exporter in background
        run: |
          set -euo pipefail
          sudo -b sh -c './target/release/ztop-exporter -p 9901 -i 1 ztoptest \
            > /tmp/exporter.log 2>&1 & echo $! > /tmp/exporter.pid'
          # Give the exporter a moment to bind and take its first snapshot.
          sleep 2
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:9901/metrics > /dev/null

      - name: Drive I/O and poll /metrics until non-zero writes are observed
        run: |
          set -euo pipefail

          # Run a continuous writer in the background for the duration of
          # the poll. With a 1s refresh interval the exporter only ever
          # reports the most recent 1s delta, and ZFS buffers writes across
          # txg boundaries (default 5s), so a single pre-scrape dd is not
          # enough: we need I/O happening *during* the poll window.
          (
            set +e
            i=0
            while [ "$i" -lt 60 ]; do
              dd if=/dev/urandom of="/ztoptest/data/file.$i" \
                bs=1M count=2 conv=fsync oflag=sync 2>/dev/null
              dd if="/ztoptest/data/file.$i" of=/dev/null bs=1M 2>/dev/null
              rm -f "/ztoptest/data/file.$i"
              i=$((i + 1))
            done
          ) &
          WRITER_PID=$!
          echo "writer pid: $WRITER_PID"

          # Poll /metrics until we see non-zero write bytes for ztoptest/data,
          # or give up after ~30s. Retain the last response body for the
          # subsequent assertion step.
          found=""
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9901/metrics > /tmp/metrics.txt || {
              sleep 1
              continue
            }
            if awk '
              /^zfs_dataset_write_bytes_per_second\{dataset="ztoptest\/data"\}/ {
                if ($2+0 > 0) { exit 0 }
              }
              END { exit 1 }
            ' /tmp/metrics.txt; then
              found="yes"
              echo "attempt $attempt: observed non-zero write bytes"
              break
            fi
            echo "attempt $attempt: still zero, retrying"
            sleep 1
          done

          # Stop the writer regardless of outcome.
          kill "$WRITER_PID" 2>/dev/null || true
          wait "$WRITER_PID" 2>/dev/null || true

          if [ -z "$found" ]; then
            echo "ERROR: never observed non-zero write bytes for ztoptest/data"
            echo "--- last /metrics response ---"
            cat /tmp/metrics.txt || true
            echo "--- /proc/spl/kstat/zfs/ztoptest ---"
            sudo ls -la /proc/spl/kstat/zfs/ztoptest/ || true
            for f in /proc/spl/kstat/zfs/ztoptest/objset-*; do
              echo "=== $f ==="
              sudo cat "$f" || true
            done
            exit 1
          fi

      - name: Validate /metrics shape
        run: |
          set -euo pipefail
          echo "--- /metrics ---"
          cat /tmp/metrics.txt
          echo "--- assertions ---"

          # Every dataset series must appear for ztoptest/data.
          grep -q 'zfs_dataset_read_ops_per_second{dataset="ztoptest/data"}' /tmp/metrics.txt
          grep -q 'zfs_dataset_write_ops_per_second{dataset="ztoptest/data"}' /tmp/metrics.txt
          grep -q 'zfs_dataset_read_bytes_per_second{dataset="ztoptest/data"}' /tmp/metrics.txt
          grep -q 'zfs_dataset_write_bytes_per_second{dataset="ztoptest/data"}' /tmp/metrics.txt
          grep -q 'zfs_dataset_unlink_ops_per_second{dataset="ztoptest/data"}' /tmp/metrics.txt

          # The pool's own root objset (ztoptest) should also be reported.
          grep -q 'zfs_dataset_read_ops_per_second{dataset="ztoptest"}' /tmp/metrics.txt

          # Prometheus header lines.
          grep -q '^# HELP zfs_dataset_read_bytes_per_second' /tmp/metrics.txt
          grep -q '^# TYPE zfs_dataset_read_bytes_per_second gauge' /tmp/metrics.txt

      - name: Smoke-test ztop TUI binary against the live pool
        run: |
          set -euo pipefail
          # Run the TUI under `script` so it gets a pty, with a 2s timeout.
          # Exit code 124 from `timeout` means it ran for the full 2s without
          # crashing, which is success for this smoke test.
          set +e
          sudo script -qc 'timeout 2 ./target/release/ztop ztoptest' /dev/null \
            > /tmp/ztop.log 2>&1
          rc=$?
          set -e
          echo "ztop exited with $rc"
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then
            echo "ERROR: ztop did not run cleanly under timeout"
            cat /tmp/ztop.log
            exit 1
          fi

      - name: Show exporter log
        if: always()
        run: |
          if [ -f /tmp/exporter.log ]; then
            echo "--- ztop-exporter log ---"
            cat /tmp/exporter.log
          fi

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [ -f /tmp/exporter.pid ]; then
            sudo kill "$(cat /tmp/exporter.pid)" 2>/dev/null || true
          fi
          sudo zpool destroy ztoptest 2>/dev/null || true
          sudo rm -f /tmp/ztoptest.img
